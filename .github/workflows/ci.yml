# CI for the IMS Angular UI repository
#
#   build  : npm ci + production build (+ unit tests when you switch them on)
#   e2e    : SQL Server container + Invoice.CqrsAPI (checked out from the API repository) + Angular dev server,
#            then the Playwright .NET tests in e2e/Invoice.UI.Tests
#
# One-time setup in GitHub (Settings > Secrets and variables > Actions):
#   Variables  API_REPOSITORY   owner/name of the repository that contains Invoice.CqrsAPI   (required)
#              API_REF          branch / tag of that repository                                (default: main)
#              API_PROJECT      path of the API project inside it         (default: Invoice.CqrsAPI/Invoice.CqrsAPI.csproj)
#              API_DB_SCRIPT    SQL script that creates the test database (default: Database/CI/01_Initialize_Accounts_Test.sql)
#              RUN_UNIT_TESTS   set to true to run "npm test" in the build job
#   Secret     API_REPO_TOKEN   a personal access token with read access to the API repository (only if it is private)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  DOTNET_VERSION: "10.0.x"
  DB_NAME: Accounts_Test
  SA_PASSWORD: "Ci_Sql_Pass_123!"
  API_URL: http://localhost:5064
  UI_URL: http://localhost:4200
  UI_USER: admin
  UI_PASSWORD: "Admin@123"

jobs:
  # ------------------------------------------------------------------------------------------------
  build:
    name: Angular build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        if: ${{ vars.RUN_UNIT_TESTS == 'true' }}
        run: npm test -- --watch=false

  # ------------------------------------------------------------------------------------------------
  e2e:
    name: Playwright UI tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Sql_Pass_123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci_Sql_Pass_123! -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s

    steps:
      - name: Check the API repository variable
        run: |
          if [ -z "${{ vars.API_REPOSITORY }}" ]; then
            echo "::error::Set the repository variable API_REPOSITORY (owner/name of the repository that contains Invoice.CqrsAPI)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Check out the API repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.API_REPOSITORY }}
          ref: ${{ vars.API_REF || 'main' }}
          token: ${{ secrets.API_REPO_TOKEN || github.token }}
          path: api

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ---------------------------------------------------------------- database
      - name: Create the test database
        env:
          DB_SCRIPT: ${{ vars.API_DB_SCRIPT || 'Database/CI/01_Initialize_Accounts_Test.sql' }}
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/api/$(dirname "$DB_SCRIPT"):/sql" \
            mcr.microsoft.com/mssql-tools \
            /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -b -i "/sql/$(basename "$DB_SCRIPT")"

      # ---------------------------------------------------------------- API on :5064
      - name: Build Invoice.CqrsAPI
        env:
          API_PROJECT: ${{ vars.API_PROJECT || 'Invoice.CqrsAPI/Invoice.CqrsAPI.csproj' }}
        run: dotnet build "api/$API_PROJECT" -c Release

      - name: Start Invoice.CqrsAPI
        env:
          API_PROJECT: ${{ vars.API_PROJECT || 'Invoice.CqrsAPI/Invoice.CqrsAPI.csproj' }}
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=${{ env.DB_NAME }};User Id=sa;Password=Ci_Sql_Pass_123!;Encrypt=False;TrustServerCertificate=True"
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          nohup dotnet run --project "api/$API_PROJECT" -c Release --no-build --no-launch-profile --urls "$API_URL" > "$GITHUB_WORKSPACE/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "$API_URL/health" > /dev/null; then echo "API is up"; exit 0; fi
            sleep 2
          done
          echo "::error::The API did not start. Last log lines:"; tail -n 50 "$GITHUB_WORKSPACE/api.log"; exit 1

      - name: Make sure the test user exists
        run: |
          # 200 = created, 409 = already there (both are fine)
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$API_URL/api/v1/User/Create" \
            -H "Content-Type: application/json" \
            -d "{\"userName\":\"$UI_USER\",\"email\":\"$UI_USER@example.com\",\"password\":\"$UI_PASSWORD\",\"firstName\":\"UI\",\"lastName\":\"Tester\",\"phoneNumber\":\"9876543210\",\"addressLine1\":\"1 Main Road\",\"city\":\"Chennai\",\"state\":\"TN\",\"zipCode\":\"600001\",\"country\":\"India\",\"isActive\":true}")
          echo "User/Create returned $code"
          if [ "$code" != "200" ] && [ "$code" != "409" ]; then exit 1; fi

      # ---------------------------------------------------------------- Angular on :4200, talking to the API on :5064
      - name: Install packages
        run: npm ci

      - name: Point the Angular app at the CQRS API (5064)
        run: sed -i "s#http://localhost:5063/api#http://localhost:5064/api#g" src/environments/*.ts

      - name: Start the Angular dev server
        run: |
          nohup npm start -- --host 127.0.0.1 --port 4200 > ui.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS "$UI_URL" > /dev/null; then echo "UI is up"; exit 0; fi
            sleep 2
          done
          echo "::error::The Angular app did not start. Last log lines:"; tail -n 50 ui.log; exit 1

      # ---------------------------------------------------------------- Playwright
      - name: Build the UI tests
        run: dotnet build e2e/Invoice.UI.Tests -c Release

      - name: Install the Playwright browser
        run: pwsh e2e/Invoice.UI.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run the UI tests
        env:
          UI_BASE_URL: ${{ env.UI_URL }}
          API_BASE_URL: ${{ env.API_URL }}
          ARTIFACTS_DIR: ${{ github.workspace }}/e2e-artifacts
        run: >
          dotnet test e2e/Invoice.UI.Tests -c Release --no-build
          --logger "trx;LogFileName=ui-tests.trx" --logger "console;verbosity=normal"
          --results-directory e2e-results

      - name: Upload failure evidence (screenshots, traces) and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            e2e-artifacts/failures
            e2e-artifacts/videos
            e2e-results
            api.log
            ui.log
          if-no-files-found: ignore
          retention-days: 14
