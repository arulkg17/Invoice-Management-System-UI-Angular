<div class="page narrow">
  <div class="page-header">
    <h2>{{ isEdit() ? "Edit Category" : "New Category" }}</h2>
  </div>

  @if (isLoading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }

  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Category Code</mat-label>
        <input matInput formControlName="code" maxlength="20" />
        @if (form.controls.code.hasError("required")) {
          <mat-error>Code is required</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Category Name</mat-label>
        <input matInput formControlName="name" maxlength="100" />
        @if (form.controls.name.hasError("required")) {
          <mat-error>Name is required</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>
        <input matInput formControlName="description" maxlength="100" />
      </mat-form-field>

      <mat-checkbox formControlName="isActive" class="full">Active</mat-checkbox>
    </div>

    <div class="buttons">
      <button mat-flat-button color="primary" type="submit" [disabled]="isSaving()">
        {{ isEdit() ? "Update" : "Save" }}
      </button>

      <button mat-button type="button" (click)="goBack()">Close</button>
    </div>
  </form>
</div>
