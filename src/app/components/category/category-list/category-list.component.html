<div class="page">
  <div class="page-header">
    <h2>Categories</h2>

    <button mat-flat-button color="primary" type="button" (click)="add()">
      <mat-icon>add</mat-icon>
      New Category
    </button>
  </div>

  <!-- SEARCH -->
  <form [formGroup]="filterForm" class="filters">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Code</mat-label>
      <input matInput formControlName="code" placeholder="Search..." />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="Search..." />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Status</mat-label>
      <mat-select formControlName="isActive">
        <mat-option [value]="null">All</mat-option>
        <mat-option [value]="true">Active</mat-option>
        <mat-option [value]="false">Inactive</mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-stroked-button type="button" (click)="clearFilters()">
      Clear
    </button>
  </form>

  @if (isLoading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }

  <!-- TABLE -->
  <table mat-table [dataSource]="categories()" class="mat-elevation-z4">
    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef>Code</th>
      <td mat-cell *matCellDef="let c">
        <a class="link" (click)="edit(c)">{{ c.code }}</a>
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let c">{{ c.name }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let c">{{ c.description }}</td>
    </ng-container>

    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let c">
        <span
          class="badge"
          [class.badge-active]="c.isActive"
          [class.badge-inactive]="!c.isActive"
        >
          {{ c.isActive ? "Active" : "Inactive" }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="actions">Actions</th>
      <td mat-cell *matCellDef="let c" class="actions">
        <button
          mat-icon-button
          type="button"
          matTooltip="Edit"
          (click)="edit(c)"
        >
          <mat-icon>edit</mat-icon>
        </button>

        <button
          mat-icon-button
          type="button"
          color="warn"
          matTooltip="Delete"
          (click)="remove(c)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (!isLoading() && categories().length === 0) {
    <div class="empty">No categories found.</div>
  }

  <mat-paginator
    [length]="totalRecords()"
    [pageSize]="pageSize()"
    [pageIndex]="pageIndex()"
    [pageSizeOptions]="[5, 10, 25, 50]"
    showFirstLastButtons
    (page)="onPage($event)"
  ></mat-paginator>
</div>
